services:
  koderline:
    build: .
    container_name: koderline_app
    restart: unless-stopped
    environment:
      - WORKCORD_TOKEN=MySuperSecretOfficePass2026
    volumes:
      - koderline_data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2-alpine
    container_name: koderline_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - koderline

volumes:
  koderline_data:
  caddy_data:
  caddy_config: